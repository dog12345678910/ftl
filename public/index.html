<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Foot Locker Restock Monitor</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0f1115; color: #e7e9ee; }
  @media (prefers-color-scheme: light) { body { background: #f6f7f9; color: #1b1d22; } }
  header { padding: 20px 24px; border-bottom: 1px solid #2a2e37; display: flex;
           align-items: center; gap: 16px; flex-wrap: wrap; }
  @media (prefers-color-scheme: light) { header { border-color: #e2e4e9; } }
  h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .stats { display: flex; gap: 20px; margin-left: auto; font-size: 13px; opacity: .85; }
  .stats b { font-size: 16px; }
  main { padding: 20px 24px; max-width: 1100px; margin: 0 auto; }
  .banner { max-width: 1100px; margin: 16px auto 0; padding: 10px 14px; border-radius: 10px;
            background: rgba(110,168,254,.14); color: #8fb6ff; font-size: 13px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; opacity: .6; margin: 28px 0 10px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid #23262e; vertical-align: top; }
  @media (prefers-color-scheme: light) { th, td { border-color: #e6e8ec; } }
  th { font-size: 12px; text-transform: uppercase; letter-spacing: .04em; opacity: .55; }
  a { color: #6ea8fe; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .pill { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; }
  .in { background: rgba(46,204,113,.18); color: #48d18a; }
  .out { background: rgba(120,130,145,.18); color: #9aa4b2; }
  .err { background: rgba(231,76,60,.18); color: #f0776a; }
  .sizes { font-variant-numeric: tabular-nums; }
  .muted { opacity: .55; }
  .feed li { list-style: none; padding: 8px 0; border-bottom: 1px solid #23262e; }
  @media (prefers-color-scheme: light) { .feed li { border-color: #e6e8ec; } }
  .feed ul { padding: 0; margin: 0; }
  .kind { font-weight: 650; margin-right: 6px; }
  .empty { opacity: .5; padding: 16px 0; }
  footer { padding: 16px 24px; opacity: .4; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>👟 Restock Monitor</h1>
  <div class="stats">
    <span><b id="s-instock">–</b> in stock</span>
    <span><b id="s-watched">–</b> watched</span>
    <span class="muted" id="s-updated">updating…</span>
  </div>
</header>
<div id="banner" class="banner" style="display:none"></div>
<main>
  <h2>Products</h2>
  <table>
    <thead><tr><th>Product</th><th>Store</th><th>Status</th><th>Sizes</th><th>Price</th><th>Checked</th></tr></thead>
    <tbody id="products"><tr><td colspan="6" class="empty">Loading…</td></tr></tbody>
  </table>

  <h2>Recent restocks</h2>
  <div class="feed"><ul id="feed"><li class="empty">No events yet.</li></ul></div>
</main>
<footer>Auto-refreshes every 15s. Continuous monitoring &amp; alerts run in the bot, not here — see the repo README.</footer>

<script>
// Inline fallback so the page renders even as a purely static deploy.
const FALLBACK = {
  demo: true, watched_count: 4, in_stock_count: 2,
  products: [
    {sku:"314206561604", name:"Air Jordan 1 Retro High OG 'Chicago'", url:"https://www.footlocker.com/product/~/314206561604.html", retailer:"footlocker", in_stock:true, available_sizes:["9","10","11.5"], price:"$180.00", error:null},
    {sku:"316153042104", name:"Nike Dunk Low 'Panda'", url:"https://www.champssports.com/product/~/316153042104.html", retailer:"champssports", in_stock:false, available_sizes:[], price:"$115.00", error:null},
    {sku:"412998710401", name:"New Balance 550 'White Green'", url:"https://www.footlocker.com/product/~/412998710401.html", retailer:"footlocker", in_stock:true, available_sizes:["8.5","9","9.5","10"], price:"$120.00", error:null},
    {sku:"551829060801", name:"Yeezy Slide 'Onyx'", url:"https://www.kidsfootlocker.com/product/~/551829060801.html", retailer:"kidsfootlocker", in_stock:false, available_sizes:[], price:"$70.00", error:"HTTP 403 (Akamai bot challenge)"},
  ],
  events: [
    {kind:"restock", name:"Air Jordan 1 Retro High OG 'Chicago'", sizes:["9","10"], price:"$180.00", url:"https://www.footlocker.com/product/~/314206561604.html"},
    {kind:"restock", name:"New Balance 550 'White Green'", sizes:["9.5"], price:"$120.00", url:"https://www.footlocker.com/product/~/412998710401.html"},
    {kind:"in_stock", name:"New Balance 550 'White Green'", sizes:["10"], price:"$120.00", url:"https://www.footlocker.com/product/~/412998710401.html"},
  ],
};
const KIND_LABEL = { restock: "🔔 Restock", in_stock: "👟 In stock", price_drop: "💸 Price drop" };
function ago(ts) {
  if (!ts) return "—";
  const s = Math.max(0, Math.floor(Date.now()/1000 - ts));
  if (s < 60) return s + "s ago";
  if (s < 3600) return Math.floor(s/60) + "m ago";
  if (s < 86400) return Math.floor(s/3600) + "h ago";
  return Math.floor(s/86400) + "d ago";
}
function esc(s){ return (s??"").toString().replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(d) {
  document.getElementById("s-instock").textContent = d.in_stock_count ?? d.products.filter(p=>p.in_stock).length;
  document.getElementById("s-watched").textContent = d.watched_count ?? d.products.length;
  document.getElementById("s-updated").textContent = "updated " + new Date().toLocaleTimeString();

  const banner = document.getElementById("banner");
  if (d.demo) {
    banner.style.display = "block";
    banner.innerHTML = "Showing <b>sample data</b> — Vercel is serverless and can't run the always-on monitor. "
      + "Run the bot on a persistent host and set <code>MONITOR_STATE_URL</code> to show live data.";
  } else { banner.style.display = "none"; }

  document.getElementById("products").innerHTML = d.products.map(p => {
    const status = p.error
      ? `<span class="pill err" title="${esc(p.error)}">error</span>`
      : p.in_stock ? `<span class="pill in">in stock</span>` : `<span class="pill out">out</span>`;
    const name = p.url ? `<a href="${esc(p.url)}" target="_blank" rel="noopener">${esc(p.name)}</a>` : esc(p.name);
    const sizes = (p.available_sizes||[]).length ? esc(p.available_sizes.join(", ")) : "—";
    return `<tr><td>${name}</td><td class="muted">${esc(p.retailer)}</td><td>${status}</td>
      <td class="sizes">${sizes}</td><td>${esc(p.price)||"—"}</td><td class="muted">${ago(p.checked_at)}</td></tr>`;
  }).join("") || `<tr><td colspan="6" class="empty">No checks recorded yet.</td></tr>`;

  document.getElementById("feed").innerHTML = (d.events||[]).map(e => {
    const label = KIND_LABEL[e.kind] || e.kind;
    const sizes = (e.sizes||[]).length ? " — sizes " + esc(e.sizes.join(", ")) : "";
    const link = e.url ? ` <a href="${esc(e.url)}" target="_blank" rel="noopener">open</a>` : "";
    return `<li><span class="kind">${label}</span>${esc(e.name)}${sizes}
      <span class="muted">· ${ago(e.ts)}</span>${link}</li>`;
  }).join("") || `<li class="empty">No events yet.</li>`;
}
async function refresh() {
  try {
    const r = await fetch("/api/status", { cache: "no-store" });
    if (!r.ok) throw new Error("bad status");
    render(await r.json());
  } catch (e) {
    render(FALLBACK);  // static/preview mode
  }
}
refresh();
setInterval(refresh, 15000);
</script>
</body>
</html>
